services:
  server:
    build:
      context: ./server
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5174:80"
    depends_on:
      - server
    restart: unless-stopped